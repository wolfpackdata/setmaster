# The `fixed-on-develop` labeling workflow — THE PUBLIC-REPO STANDALONE COPY (#105).
#
# THIS FILE IS THE EXCEPTION, NOT THE RULE. The 32 private repos carry a caller stub
# (`assets/workflows/fixed-on-develop.yml`) that calls the one reusable copy of this logic in
# `wolfpackdata/wp-github-sop`. The three PUBLIC repos — `setmaster`, `wp-website` and
# `wolfpackdata/.github` — cannot: a public repository cannot resolve a reusable workflow in a
# private repository, whatever the source's Actions access level (measured 2026-09-03;
# recommendation J in docs/sop/10-ai-review.md). So they carry a standalone copy, with no `uses:`
# of any kind.
#
# THIS COPY MUST NOT DRIFT FROM THE REUSABLE FILE. Everything from the SHARED BODY marker down is
# byte-identical to `.github/workflows/fixed-on-develop.yml` in `wp-github-sop`;
# `scripts/check-workflow-parity.sh` proves it and `scripts/retrofit-repo.sh` refuses to sweep
# when it does not hold. A change here reaches these three repos only by re-running
# `scripts/retrofit-repo.sh --local-copies` against them — moving the `workflows-v1` tag does
# nothing for them. That asymmetry is the cost of the exception, and it is why the exception is
# three repos.
#
# WHY IT EXISTS
# docs/sop/03-issues-and-labels.md carries an invariant: every issue whose fix is merged to
# `develop` is either labeled `fixed-on-develop` or closed. Until this workflow that invariant
# held only when an agent happened to run the merge. On 2026-08-31 three PRs merged into
# `develop` by hand and every issue they fixed was missed, while the agent-merged PRs of the
# same round were labeled — coverage split exactly along who pressed the button. The information
# was present in the PRs and correct; it simply had no consumer. This is the consumer.
#
# WHAT IT LABELS — ONLY WHAT THE PR DELIVERS (#197; the Admin's ruling on #142, 2026-10-22)
# Until then this job labeled every issue a PR body named with `Refs #N`, so a PR that merely
# CITED, DEFERRED or FILED an issue put it in the verification queue with nothing built
# (`c491-evals` PR #74 cited four unbuilt issues and all four were labeled). Now the delivered
# set is the head branch's issue number (`prefix/N-slug`), or, when the body carries one, the
# `Delivers: #N` lines instead. `Refs #N` is a citation and labels nothing. Topic 03, "What a
# merged PR delivers", is the definition; the WHAT COUNTS block in the step below implements it.
#
# WHAT IT DELIBERATELY DOES NOT DO
# It never closes anything. Closing is release-gated and Admin-driven (topic 03, "Closing at
# release time"), and an automation that closed issues would quietly delete the verification
# queue this label exists to build.
#
# WHERE IT DOES NOT FIRE — and why the manual rule still has an owner
#   * base `main` — releases are Admin business and out of scope by design (the caller's
#     `branches:` filter).
#   * a Lightweight-profile repo whose integration branch IS `main`: nothing fires there at all.
#   * a pull request from a fork: GitHub hands the `pull_request` event a read-only token for
#     fork PRs no matter what the `permissions:` block says, and the reusable form does not
#     improve it — the token is issued against the CALLER's event and passed down as issued.
#     (`pull_request_target` would have write, and is a well-known footgun; not worth it for a
#     fleet with no fork traffic.)
#   * a PR that delivers nothing — an unnumbered head branch and no `Delivers:` line.
# Those gaps are why topic 03 names the merging **Maintainer** as the actor on the manual path
# instead of leaving the sentence in the passive voice, and why scripts/sop-audit.sh reports the
# invariant as its own column: the workflow labels what a PR delivers, and the audit names the
# merged PRs that delivered nothing (`nodeliv:`) so a human can look at them.
#
# FAN-OUT PROVENANCE — a sweep that copies this file inherits the review of the pull request named
# by `--source-pr`, and `scripts/retrofit-repo.sh` accepts that pull request only when its OWN
# reviewed diff touched this path, so when a change splits the four workflow templates across two
# pull requests the next fan-out needs one pull request — a header-only edit is enough — whose diff
# touched every template it will copy (docs/sop/10-ai-review.md, "The evidence the PR must carry").

name: fixed-on-develop

on:
  pull_request:
    # `closed` fires on both merge and plain close; the job guard below keeps only the merges.
    types: [closed]
    # Base-branch filter. `develop` only: the label means "merged to develop, awaiting
    # verification", and a release merge into `main` must not re-label anything.
    branches: [develop]

# ======================== SHARED BODY BEGIN ========================
# EVERY BYTE BELOW THIS LINE IS IDENTICAL IN TWO FILES:
#   .github/workflows/fixed-on-develop.yml       - the reusable workflow the stubs call
#   assets/workflows-local/fixed-on-develop.yml  - the standalone copy the three public repos carry
# `scripts/check-workflow-parity.sh` proves it, and `scripts/retrofit-repo.sh` refuses to run a
# sweep when it fails. Edit one and not the other and the fleet splits into two gates that look
# the same and are not - the precise failure this whole design exists to make impossible.
# ===================================================================
# Least privilege. `issues: write` covers both halves of the job — adding a label to an issue and
# creating the label itself, since labels live under the Issues API. Nothing is read from the
# repository contents, and no pull-request write is ever made.
permissions:
  issues: write

jobs:
  label:
    # Merged, not merely closed. A PR closed without merging fixed nothing.
    if: github.event.pull_request.merged == true
    name: Label the issues this PR delivers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply fixed-on-develop to every issue this PR delivers
        env:
          # The body and the head branch go through the environment, never through `${{ }}`
          # interpolation into the script: both are attacker-controlled text (a branch name can
          # carry `$(...)` as easily as a body can), and interpolating either would paste it into
          # the shell before bash ever sees a quote.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          LABEL: fixed-on-develop
          LABEL_COLOR: "0e8a16"
          LABEL_DESC: "Fix merged to develop; open pending verification against real data."
        run: |
          set -euo pipefail

          # ---------------------------------------------------------------------------------
          # WHAT COUNTS AS DELIVERED — the Admin's ruling on #142 (2026-10-22), fixing #197.
          # The canonical definition is topic 03, "What a merged PR delivers"; this is it in code.
          #
          # 1. `Delivers:` lines, when the body carries at least one that names an issue. A
          #    `Delivers:` line is one that STARTS with the keyword — only whitespace and list,
          #    quote or emphasis marks (`-`, `*`, `>`, `_`) may come before it, and `**` / `__`
          #    may wrap it (`**Delivers:** #12`). Matched case-insensitively, colon optional, on
          #    as many lines as you like (they union), with a comma-continued list after one
          #    keyword (`Delivers: #36, #25`) that terminates at the first token that is not
          #    `, #<digits>` (so `#5, #6 and #7` is 5 and 6). Fenced code blocks and HTML
          #    comments are removed first, so an example in a fence or the template's own
          #    comment never counts, and prose that merely says "delivers #5" mid-sentence never
          #    counts either. When any such line names an issue, those numbers ARE the complete
          #    delivered set and the branch number is NOT added: a PR on `fix/197-x` whose body
          #    has the line `Delivers: #198` delivers only #198, so a PR that delivers its
          #    branch's issue AND another lists both (`Delivers: #197, #198`). A `Delivers:` line
          #    naming no `#N` (the template's blank `Delivers: #`) names nothing, so rule 2
          #    applies.
          # 2. Otherwise, the head branch's issue number under the SOP's own naming rule
          #    `prefix/N-kebab-slug` (`^[A-Za-z]+/([0-9]+)(-|$)`): `fix/197-foo` delivers #197;
          #    `chore/retrofit-sweep` and `release/v1.6.0` deliver nothing. One issue -> one
          #    branch -> one PR already makes the branch the delivery signal.
          #
          # NOT delivered: `Refs #N`, and a bare `#N`. `Refs` is the plain cross-reference the
          #            closing-keyword ban always intended — a PR can cite, defer to, or file an
          #            issue without putting it in the verification queue. Until 2026-10-22 this
          #            job labeled every `Refs #N`, and `c491-evals` PR #74 put four unbuilt
          #            issues in the queue by citing them (#197).
          # NOT matched: closing keywords (`Closes` / `Fixes` / `Resolves`). The SOP bans them
          #            (topic 03) because the Reporter closes issues after verifying — parsing
          #            them here would legitimise the thing the rule forbids.
          # NOT matched: a cross-repo reference (`Delivers: owner/repo#12`) — no `#` follows the
          #            keyword, so the regex does not fire, and this job only holds a token for
          #            its own repository anyway.
          #
          # The VISIBLE, MARKED and BRANCH_N pipelines and the `${MARKED:-$BRANCH_N}` choice are
          # reproduced verbatim in `delivered_from_pr` in scripts/sop-audit.sh, so the audit's
          # Invariant column and this automation agree on what was delivered BY CONSTRUCTION
          # (#51). Change one, change both — the audit's --self-test compares the blocks.
          # ---------------------------------------------------------------------------------
          # VISIBLE is the body as a reader sees it: CRs dropped, fenced code blocks and HTML
          # comments (single- or multi-line) removed. Without it, a marker override quoted in a
          # fence or left in a comment would REPLACE the branch number (#197 review). Fences
          # follow CommonMark (PR198-001): `t` is the line with its block-quote prefixes (`>`,
          # repeated) and up to 3 spaces of indent skipped; a fence opens on 3+ backticks or 3+
          # tildes and closes only on a line of the SAME character, at least as many, followed by
          # nothing but whitespace — so `> ```` fences are stripped, a ``` line inside a ````
          # fence does not end it, and backticks never close a ~~~ fence.
          # The `^` anchor plus a decoration class with no letters is the word boundary:
          # `undelivers #8` and "this no longer delivers #8" do not start a line with the keyword.
          # The class holds no digits and no `#`, so the second `grep` cannot pull a number out
          # of it.
          VISIBLE="$(printf '%s\n' "$PR_BODY" | tr -d '\r' | awk '
            { t = $0; while (sub(/^ ? ? ?> ?/, "", t)) {}; sub(/^ ? ? ?/, "", t) }
            f { m = t; sub(/[ \t]+$/, "", m)
                if (substr(m, 1, 1) == fc && length(m) >= n && (m ~ /^`+$/ || m ~ /^~+$/)) f = 0
                next }
            !c && match(t, /^(```+|~~~+)/) && !(substr(t, 1, 1) == "`" && index(substr(t, RLENGTH + 1), "`")) {
                fc = substr(t, 1, 1); n = RLENGTH; f = 1; next }
            { o = ""; s = $0
              while (s != "") {
                if (c) { i = index(s, "-->"); if (!i) s = ""; else { s = substr(s, i + 3); c = 0 } }
                else { i = index(s, "<!--"); if (!i) { o = o s; s = "" } else { o = o substr(s, 1, i - 1); s = substr(s, i + 4); c = 1 } }
              }
              print o }' || true)"
          MARKED="$(printf '%s\n' "$VISIBLE" \
            | grep -oiE '^[[:space:]>*_-]*delivers[*_]*:?[*_]*[[:space:]]*#[0-9]+([[:space:]]*,[[:space:]]*#[0-9]+)*' \
            | grep -oE '#[0-9]+' | tr -d '#' | sort -un || true)"
          BRANCH_N="$(printf '%s\n' "$PR_HEAD_REF" \
            | grep -oE '^[A-Za-z]+/[0-9]+(-|$)' \
            | grep -oE '[0-9]+' | sort -un || true)"
          DELIVERS="${MARKED:-$BRANCH_N}"

          # A line that starts with the keyword and carries a number, yet parsed to nothing
          # (`Delivers: [#12](url)`, `Delivers: issue 12`), is an author who meant to override
          # the branch and was not heard. Say so rather than fall back silently. (`>/dev/null`,
          # not `grep -q`: an early exit would SIGPIPE printf and, under pipefail, read as false.)
          if [ -z "$MARKED" ] && printf '%s\n' "$VISIBLE" \
               | grep -iE '^[[:space:]>*_-]*delivers([^[:alnum:]].*)?[0-9]' >/dev/null; then
            echo "::warning title=Unparsed Delivers: line::PR #$PR_NUMBER has a 'Delivers' line this job could not read, so it fell back to the head branch's number (${BRANCH_N:-none}). Write it as 'Delivers: #N, #M' and label any missed issue by hand (docs/sop/03-issues-and-labels.md, 'What a merged PR delivers')."
          fi

          if [ -z "$DELIVERS" ]; then
            echo "::notice title=No delivered issue::PR #$PR_NUMBER named no delivered issue (its head branch is not prefix/N-slug and its body has no 'Delivers: #N' line), so there is nothing to label. 'Refs #N' is a citation only and labels nothing. If it did deliver an issue, the merging Maintainer applies the label by hand (docs/sop/03-issues-and-labels.md, 'What a merged PR delivers')."
            exit 0
          fi

          echo "Delivered issues: $(echo "$DELIVERS" | tr '\n' ' ')"

          # Create the label if the repo lacks it — same color and description as topic 03's
          # create-if-missing table, so a repo bootstrapped by this workflow and one bootstrapped
          # by scripts/bootstrap-labels.sh end up identical. Create-if-absent rather than
          # `gh label create --force`: `--force` would restyle the repo's label on every single
          # merge, and this job has no business editing a label it did not create. The `|| true`
          # covers the race where two merges land at once and both try to create it.
          #
          # Every call below is `gh api` — the REST endpoints — rather than `gh label` /
          # `gh issue`, which go through GraphQL. GraphQL needs broader repository read than the
          # `permissions:` block above grants, and a least-privilege token that works only
          # because a convenience command happened to fall back to REST is a trap for whoever
          # copies this file next.
          if gh api "repos/$REPO/labels/$LABEL" >/dev/null 2>&1; then
            echo "Label '$LABEL' already exists."
          else
            echo "Label '$LABEL' missing — creating it."
            gh api -X POST "repos/$REPO/labels" \
              -f "name=$LABEL" -f "color=$LABEL_COLOR" -f "description=$LABEL_DESC" \
              >/dev/null || true
          fi

          # Idempotent by construction: POST .../labels is a set UNION, not a replace, so a
          # second run over an already-labeled issue is a no-op that returns 200 and leaves every
          # other label alone. Re-running this workflow on an old merge is therefore always safe.
          FAILED=""
          for N in $DELIVERS; do
            # A delivered number can still resolve to a pull request (a typo, or a branch named
            # after a PR). Skip those rather than labeling them: a PR is not part of the
            # verification queue. The same GET also tells us the number resolves at all.
            IS_PR="$(gh api "repos/$REPO/issues/$N" --jq '.pull_request.url // empty' 2>/dev/null || true)"
            if [ -n "$IS_PR" ]; then
              echo "  #$N is a pull request — skipped."
              continue
            fi

            if gh api -X POST "repos/$REPO/issues/$N/labels" \
                 -f "labels[]=$LABEL" >/dev/null 2>&1; then
              echo "  #$N labeled '$LABEL'."
            else
              echo "  #$N could NOT be labeled (missing, transferred, or not accessible)."
              FAILED="${FAILED:+$FAILED }#$N"
            fi
          done

          # A failure is surfaced, never swallowed — an unlabeled issue is the exact defect this
          # workflow exists to prevent, so it must not fail quietly. It is a warning rather than
          # a non-zero exit because the merge has already happened: there is nothing left to
          # block, and a red X on a merged PR would train everyone to ignore red Xs.
          if [ -n "$FAILED" ]; then
            echo "::warning title=Some issues were not labeled::$FAILED — apply '$LABEL' by hand (docs/sop/03-issues-and-labels.md)."
          fi
