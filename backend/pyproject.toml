[project]
name = "setmaster3-backend"
version = "3.0.3"
description = "SetMaster 3 backend: FastAPI app + ported SM2 pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=2.3.2,<3",
    # numpy 2.5.1's _generator.pyd is hash-blocked by Windows Smart App
    # Control on Ry's machine (issue #57) — keep pip from resolving it.
    "numpy!=2.5.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "regex>=2024.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: golden-master tests against the legacy SM2 pipeline (slow, needs testdata)",
    "scale: full-scale performance checks",
]

[tool.setuptools.packages.find]
include = ["app*", "pipeline*"]
